[package]
name = "hub-mcp"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
hub-core.workspace = true
rmcp = { version = "3.6.0", features = ["server", "macros", "transport-streamable-http-server", "client", "transport-streamable-http-client-reqwest"] }
axum = "0.8.9"
serde.workspace = true
serde_json = "1"
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread"] }
tracing.workspace = true

[dev-dependencies]
rmcp = { version = "3.6.0", features = ["client", "transport-streamable-http-client-reqwest"] }
tempfile.workspace = true

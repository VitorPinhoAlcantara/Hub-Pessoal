[package]
name = "hub-core"
version.workspace = true
edition.workspace = true
publish = false

[features]
distribuicao = []

[dependencies]
argon2.workspace = true
base64.workspace = true
chacha20poly1305.workspace = true
chrono.workspace = true
cron.workspace = true
futures.workspace = true
notify.workspace = true
notify-rust.workspace = true
directories.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json = "1"
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
zip.workspace = true
zeroize.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
sysinfo = { version = "0.40.0", default-features = false, features = ["system"] }
tray-icon.workspace = true
arboard.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Foundation", "Media_Control", "Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Performance", "Win32_UI_Shell"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading"] }

[target.'cfg(windows)'.dependencies.window-vibrancy]
version = "0.8.1"

[target.'cfg(windows)'.dependencies.raw-window-handle]
version = "0.6.2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.19.0"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

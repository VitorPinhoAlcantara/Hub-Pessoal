[package]
name = "panel-ia"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
base64.workspace = true
futures.workspace = true
hub-core.workspace = true
hub-ui-kit.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "native-tls"] }
rmcp = { version = "3.6.0", features = ["client", "transport-streamable-http-client-reqwest"] }
serde_json = "1"
tokio = { workspace = true, features = ["fs"] }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

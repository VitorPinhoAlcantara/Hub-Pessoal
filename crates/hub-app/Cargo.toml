[package]
name = "hub-app"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "hub"
path = "src/main.rs"

[features]
distribuicao = ["hub-core/distribuicao"]

[dependencies]
anyhow.workspace = true
hub-core.workspace = true
iced.workspace = true
hub-ui-kit.workspace = true
section-agenda.workspace = true
section-scripts.workspace = true
section-atalhos.workspace = true
section-notas.workspace = true
section-perifericos.workspace = true
section-inicio.workspace = true
panel-terminal.workspace = true
section-whatsapp.workspace = true
panel-ia.workspace = true
panel-player.workspace = true
hub-mcp.workspace = true
tokio.workspace = true
tracing.workspace = true

[build-dependencies]
embed-resource = "3"

[package.metadata.packager]
product-name = "Hub Pessoal"
identifier = "com.vitoralcantara.hubpessoal"
publisher = "Vitor Alcantara"
description = "Hub pessoal com agenda, scripts, atalhos, WhatsApp e IA"
out-dir = "../../target/distribuicao/pacote"
binaries-dir = "../../target/distribuicao/release"
formats = ["nsis"]
icons = ["../../assets/app/hub.png", "../../assets/app/hub.ico"]
binaries = [{ path = "HubPessoal", main = true }]

[package.metadata.packager.nsis]
installer-mode = "currentUser"
installer-icon = "../../assets/app/hub.ico"
languages = ["PortugueseBR"]
preinstall-section = """
Section OpenRgbOpcional
  IfSilent openrgb_fim
  nsExec::ExecToStack 'winget --version'
  Pop $0
  StrCmp $0 "0" 0 openrgb_fim
  nsExec::ExecToStack 'winget list --id OpenRGB.OpenRGB -e --accept-source-agreements'
  Pop $0
  StrCmp $0 "0" openrgb_fim
  MessageBox MB_YESNO|MB_ICONQUESTION "Instalar também o OpenRGB? Ele permite que o Hub controle os LEDs do teclado, mouse, memórias, placa mãe e ventoinhas. A instalação usa o winget e pode levar alguns minutos." IDNO openrgb_fim
  DetailPrint "Instalando o OpenRGB pelo winget"
  nsExec::ExecToLog 'winget install --id OpenRGB.OpenRGB -e --silent --accept-source-agreements --accept-package-agreements'
  Pop $0
  StrCmp $0 "0" openrgb_fim
  MessageBox MB_OK|MB_ICONEXCLAMATION "Não foi possível instalar o OpenRGB agora. Dá para instalar depois pela aba Periféricos do Hub."
  openrgb_fim:
SectionEnd
"""

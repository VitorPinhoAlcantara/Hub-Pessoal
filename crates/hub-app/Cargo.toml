[package]
name = "hub-app"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "hub"
path = "src/main.rs"

[features]
distribuicao = ["hub-core/distribuicao"]

[dependencies]
anyhow.workspace = true
hub-core.workspace = true
iced.workspace = true
hub-ui-kit.workspace = true
section-agenda.workspace = true
section-scripts.workspace = true
section-atalhos.workspace = true
section-notas.workspace = true
section-desempenho.workspace = true
section-perifericos.workspace = true
section-inicio.workspace = true
panel-terminal.workspace = true
section-whatsapp.workspace = true
panel-ia.workspace = true
panel-player.workspace = true
hub-mcp.workspace = true
tokio.workspace = true
tracing.workspace = true

[build-dependencies]
embed-resource = "3"

[package.metadata.packager]
product-name = "Hub Pessoal"
identifier = "com.vitoralcantara.hubpessoal"
publisher = "Vitor Alcantara"
description = "Hub pessoal com agenda, scripts, atalhos, WhatsApp e IA"
out-dir = "../../target/distribuicao/pacote"
binaries-dir = "../../target/distribuicao/release"
formats = ["nsis"]
icons = ["../../assets/app/hub.png", "../../assets/app/hub.ico"]
binaries = [{ path = "HubPessoal", main = true }]
resources = ["../../target/distribuicao/release/whatsapp-bridge.exe"]

[package.metadata.packager.nsis]
installer-mode = "currentUser"
installer-icon = "../../assets/app/hub.ico"
languages = ["PortugueseBR"]

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
hub-core = { path = "crates/hub-core" }
hub-ui-kit = { path = "crates/hub-ui-kit" }
section-agenda = { path = "crates/section-agenda" }
section-scripts = { path = "crates/section-scripts" }
section-atalhos = { path = "crates/section-atalhos" }
section-whatsapp = { path = "crates/section-whatsapp" }
panel-ia = { path = "crates/panel-ia" }
panel-player = { path = "crates/panel-player" }
hub-mcp = { path = "crates/hub-mcp" }

anyhow = "1.0.104"
base64 = "0.22.1"
chrono = "0.4.45"
cron = "0.17.0"
iced = { version = "0.14.0", features = ["tokio", "svg", "advanced", "markdown", "qr_code", "image"] }
notify-rust = "4.18.2"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal", "wayland"] }
directories = "6.0.0"
futures = "0.3.34"
notify = { version = "8", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled", "chrono"] }
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["sync", "time", "rt", "macros", "process", "io-util", "net"] }
thiserror = "2.0.21"
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

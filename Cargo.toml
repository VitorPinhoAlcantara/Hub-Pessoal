[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
hub-core = { path = "crates/hub-core" }
hub-ui-kit = { path = "crates/hub-ui-kit" }
section-agenda = { path = "crates/section-agenda" }
section-scripts = { path = "crates/section-scripts" }
section-inicio = { path = "crates/section-inicio" }
section-atalhos = { path = "crates/section-atalhos" }
section-notas = { path = "crates/section-notas" }
section-whatsapp = { path = "crates/section-whatsapp" }
panel-ia = { path = "crates/panel-ia" }
panel-player = { path = "crates/panel-player" }
panel-terminal = { path = "crates/panel-terminal" }
hub-mcp = { path = "crates/hub-mcp" }

argon2 = "0.5"
anyhow = "1.0.104"
arboard = "3.6"
base64 = "0.22.1"
chacha20poly1305 = "0.10"
chrono = "0.4.45"
cron = "0.17.0"
iced_term = "0.8"
iced = { version = "0.14.0", features = ["tokio", "svg", "advanced", "markdown", "qr_code", "image", "canvas"] }
notify-rust = "4.18.2"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal", "wayland"] }
directories = "6.0.0"
futures = "0.3.34"
notify = { version = "8", default-features = false }
sha2 = "0.11.1"
rusqlite = { version = "0.40.2", features = ["bundled", "chrono"] }
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["sync", "time", "rt", "macros", "process", "io-util", "net"] }
thiserror = "2.0.21"
toml = "1.1.8"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zeroize = "1"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[patch.crates-io]
iced_wgpu = { path = "vendor/iced_wgpu" }

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
hub-core = { path = "crates/hub-core" }
hub-ui-kit = { path = "crates/hub-ui-kit" }
section-agenda = { path = "crates/section-agenda" }
section-scripts = { path = "crates/section-scripts" }
section-atalhos = { path = "crates/section-atalhos" }
section-whatsapp = { path = "crates/section-whatsapp" }
panel-ia = { path = "crates/panel-ia" }
panel-player = { path = "crates/panel-player" }
hub-mcp = { path = "crates/hub-mcp" }

anyhow = "1.0.104"
directories = "6.0.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
